<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="抗蒸性测试：通过动态追问理解你的判断、经验、审美和取舍有多难被低损耗蒸馏，并生成含活人量结果。"
    />
    <title>抗蒸性测试</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" aria-label="应用导航">
        <a class="brand" href="/" aria-label="抗蒸性测试首页">
          <span class="brand-mark" aria-hidden="true">蒸</span>
          <span>抗蒸性测试</span>
        </a>
        <button class="ghost-button" id="restartTopButton" type="button" hidden>重新开始</button>
      </header>

      <main id="app" class="app-main" aria-live="polite"></main>
    </div>

    <template id="startTemplate">
      <section class="start-grid">
        <div class="start-copy">
          <h1>
            <span>测测你的判断，</span>
            <span>到底有多抗蒸。</span>
          </h1>
          <p>
            系统会用动态追问观察你的判断、经验、审美和取舍，最后生成一个有点梗、但有依据的“含活人量”结果。
          </p>
          <div class="start-actions">
            <button class="primary-button" id="startButton" type="button">开始蒸馏</button>
            <span class="microcopy">动态追问，通常十几题完成</span>
          </div>
        </div>

        <aside class="calibration-panel" aria-labelledby="calibrationTitle">
          <div>
            <h2 id="calibrationTitle">工作方式校准</h2>
            <p>可选填写。它只用于解释岗位蒸馏度，不会直接改变你的个人分数。</p>
          </div>
          <form id="roleForm" class="role-form">
            <fieldset>
              <legend>你的工作里，哪一类最多？</legend>
              <label><input name="taskShape" type="radio" value="routine" />重复执行、整理、录入、检查</label>
              <label><input name="taskShape" type="radio" value="ruleException" />按规则处理，但偶尔判断例外</label>
              <label><input name="taskShape" type="radio" value="coordination" />协调人、信息和现场变化</label>
              <label><input name="taskShape" type="radio" value="direction" />定义方向、判断取舍或承担后果</label>
            </fieldset>
            <fieldset>
              <legend>AI 最容易接走你哪部分工作？</legend>
              <label><input name="aiExposure" type="radio" value="standard" />标准流程和格式化产出</label>
              <label><input name="aiExposure" type="radio" value="draft" />信息整理、初稿、分析草稿</label>
              <label><input name="aiExposure" type="radio" value="partial" />部分方案，但要我判断能不能用</label>
              <label><input name="aiExposure" type="radio" value="guarded" />很多动作能接走，关键责任不能接走</label>
            </fieldset>
            <fieldset>
              <legend>最难被写成 SOP 的是什么？</legend>
              <label><input name="sopHardPart" type="radio" value="efficiency" />熟练度和效率</label>
              <label><input name="sopHardPart" type="radio" value="exceptions" />例外情况和具体判断</label>
              <label><input name="sopHardPart" type="radio" value="trust" />信任、情绪和博弈</label>
              <label><input name="sopHardPart" type="radio" value="taste" />方向、品味、价值取舍和后果承担</label>
            </fieldset>
          </form>
        </aside>
      </section>
    </template>

    <template id="questionTemplate">
      <section class="quiz-layout">
        <div class="quiz-status">
          <div>
            <p class="phase-label" id="phaseLabel"></p>
            <h1 id="questionText"></h1>
          </div>
          <div class="progress-stack" aria-label="答题进度">
            <span id="progressText"></span>
            <div class="progress-track"><span id="progressBar"></span></div>
          </div>
        </div>
        <div class="question-panel">
          <p class="section-intro" id="sectionIntro"></p>
          <div class="option-list" id="optionList"></div>
        </div>
      </section>
    </template>

    <template id="resultTemplate">
      <section class="result-layout">
        <div class="result-hero">
          <div class="score-card">
            <p class="result-label">含活人量指数</p>
            <div class="score-line"><span id="scoreValue"></span><span>分</span></div>
            <p class="score-help">这个分数表示：你的判断结构有多难被低损耗蒸馏成可复用流程。</p>
          </div>
          <div class="result-summary">
            <h1 id="bandName"></h1>
            <p id="bandLine"></p>
            <div class="label-card">
              <span>结构标签</span>
              <strong id="labelName"></strong>
              <p id="labelMeaning"></p>
            </div>
          </div>
        </div>

        <div class="result-grid">
          <section class="result-panel">
            <h2>六个核心维度</h2>
            <div class="dimension-list" id="dimensionList"></div>
          </section>

          <section class="result-panel">
            <h2>为什么这么判</h2>
            <p id="reasoningText"></p>
            <div class="signal-list" id="signalList"></div>
          </section>

          <section class="result-panel">
            <h2>结果候选</h2>
            <p id="candidateText"></p>
          </section>

          <section class="result-panel">
            <h2>岗位蒸馏度</h2>
            <p id="roleResult"></p>
          </section>

          <section class="result-panel method-panel">
            <h2>这套测评在看什么</h2>
            <p>
              题目不是按“选项越靠后越高分”设计，而是从情境辨识、边界校准、生成重构、审美判别、价值定向和经验内化六个核心维度观察你的判断结构。
            </p>
            <p>
              系统会先做覆盖式初筛，再根据低置信度维度、标签分叉和可能误读的地方追加追问；达到稳定条件后停止，避免把测评做成机械刷题。
            </p>
            <p>
              设计逻辑参考了专业判断研究、情境认知、专家直觉、任务可流程化程度与人机协作边界等思路。结果适合自我理解和讨论，不用于医疗、招聘或人格定论。
            </p>
          </section>
        </div>

        <div class="result-actions">
          <button class="primary-button" id="restartButton" type="button">再测一次</button>
          <button class="secondary-button" id="copyButton" type="button">复制结果摘要</button>
        </div>
      </section>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
