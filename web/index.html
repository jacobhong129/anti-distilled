<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="抗蒸性测试：看看你的判断、经验、审美和取舍有多难被低损耗蒸馏成工作流、插件或 Skill。"
    />
    <title>抗蒸性测试</title>
    <link rel="preload" href="./assets/ui-art/smoke-home-ambient.png" as="image" />
    <link rel="preload" href="./assets/ui-art/home-distillation-desktop.png" as="image" />
    <link rel="preload" href="./assets/ui-art/home-distillation-mobile.png" as="image" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="smoke-backdrop" aria-hidden="true"></div>
    <div class="app-shell">
      <header class="topbar" aria-label="应用导航">
        <a class="brand" href="./" aria-label="抗蒸性测试首页">
          <img class="brand-icon" src="./assets/ui-art/icon-brand-flask.svg" alt="" />
          <span>
            <strong>抗蒸性测试</strong>
            <small>测测你的含活人量</small>
          </span>
        </a>
        <nav class="desktop-nav" aria-label="页面导航">
          <button class="nav-button" id="learnTopButton" type="button">什么是抗蒸性？</button>
          <button class="nav-button" id="restartTopButton" type="button" hidden>重新开始</button>
        </nav>
      </header>

      <main id="app" class="app-main" aria-live="polite"></main>
    </div>

    <template id="startTemplate">
      <section class="home-page">
        <div class="hero-copy">
          <h1>测测你的抗蒸性</h1>
          <div class="title-rule" aria-hidden="true"></div>
          <p>
            看看你的判断、经验、审美和取舍，有多难被低损耗蒸馏成一套工作流、一个插件，或一个同事 Skill。
          </p>
          <div class="hero-actions">
            <button class="primary-button" id="startButton" type="button">开始测试</button>
            <button class="link-button" id="learnButton" type="button">什么是抗蒸性？</button>
          </div>
        </div>

        <figure class="distillation-art" aria-label="人的想法经过蒸馏形成工作流、插件、Skill 和提示词">
          <picture>
            <source media="(max-width: 760px)" srcset="./assets/ui-art/home-distillation-mobile.png" />
            <img src="./assets/ui-art/home-distillation-desktop.png" alt="人的想法、判断、经验、审美和取舍经过蒸馏，转化为工作流、插件、Skill 和提示词" />
          </picture>
        </figure>

        <aside class="human-note">
          <img class="sparkle-seal" src="./assets/ui-art/icon-sparkle-seal.svg" alt="" />
          <div>
            <h2>含活人量，越高越难蒸馏</h2>
            <p>我们关心的不是你会不会被替代，而是你身上那些不可低损耗复制的人味。</p>
          </div>
          <img class="human-stamp" src="./assets/ui-art/stamp-human-hard.svg" alt="人味难蒸" />
        </aside>
      </section>
    </template>

    <template id="learnTemplate">
      <section class="theory-page">
        <div class="theory-title">
          <h1>什么是抗蒸性</h1>
          <p>人在 AI 时代的低损耗不可蒸馏能力</p>
          <div class="title-rule" aria-hidden="true"></div>
        </div>

        <div class="theory-layout">
          <article class="paper-card theory-definition">
            <span class="section-number">1</span>
            <h2>概念定义：从人到 Skill 的信息损耗</h2>
            <p>
              所谓“蒸馏”，是把复杂的人类工作过程，提炼为可复用、可自动化的规则、步骤或模型，从而被机器或他人以更低成本复制的过程。
            </p>
            <p>
              抗蒸性，是指在这一过程中，仍能保留在关键判断、审美取舍与责任承担上的人味与独特性，难以被低损耗复制。
            </p>
          </article>

          <article class="paper-card layer-card">
            <span class="section-number">2</span>
            <h2>抗蒸性三层模型</h2>
            <div class="layer-model" aria-label="责任层、判断层、行为层">
              <div><strong>责任层</strong><span>为结果负责</span></div>
              <div><strong>判断层</strong><span>做出更优取舍</span></div>
              <div><strong>行为层</strong><span>执行与产出</span></div>
            </div>
            <ul class="layer-notes">
              <li>行为层最容易被流程化和标准化。</li>
              <li>判断层决定方法适不适用、何时要停下。</li>
              <li>责任层关乎信任、后果与最终承担。</li>
            </ul>
          </article>
        </div>

        <section class="paper-card dimensions-primer">
          <span class="section-number">3</span>
          <h2>六个观测维度</h2>
          <div class="dimension-primer-grid">
            <article data-metric="CXT"><span></span><strong>情境辨识</strong><p>识别关键变量与隐含约束，理解事物的真实处境。</p></article>
            <article data-metric="BND"><span></span><strong>边界校准</strong><p>判断适用范围与边界条件，知道何时该停下或调整。</p></article>
            <article data-metric="GEN"><span></span><strong>生成重构</strong><p>在既有要求上做出结构化或创造性的重新组织。</p></article>
            <article data-metric="TST"><span></span><strong>审美判别</strong><p>基于品味与语境，做出难以量化的审美与风格判断。</p></article>
            <article data-metric="STN"><span></span><strong>价值定向</strong><p>明确目标与取舍优先级，坚持长期与根本价值。</p></article>
            <article data-metric="GRD"><span></span><strong>经验内化</strong><p>将经验转化为直觉与能力，可迁移到新情境中。</p></article>
          </div>
        </section>

        <div class="theory-layout">
          <article class="paper-card">
            <span class="section-number">4</span>
            <h2>为什么它重要</h2>
            <ul class="clean-list">
              <li>AI 能复制输出，但未必理解情境、承担后果与进行取舍。</li>
              <li>决定质量差异的，往往是无法被规则穷尽的判断与品味。</li>
              <li>抗蒸性越高，你的不可替代性、信任度与议价能力越强。</li>
              <li>组织与个人的长期竞争力，取决于能否沉淀并放大这种能力。</li>
            </ul>
          </article>
          <article class="paper-card">
            <span class="section-number">5</span>
            <h2>如何培养抗蒸性</h2>
            <div class="growth-grid">
              <div><strong>积累可追溯经验</strong><p>深度参与真实任务，复盘关键决策与结果，形成个人案例库。</p></div>
              <div><strong>练习边界判断</strong><p>刻意练习在模糊信息下做决定，建立判断的条件与依据。</p></div>
              <div><strong>把隐性判断表达出来</strong><p>将直觉、审美与取舍的逻辑外显化，形成可传递的思维资产。</p></div>
            </div>
          </article>
        </div>

        <div class="theory-actions">
          <p>说明：本测试使用自拟的蒸馏损耗模型，不用于招聘、医疗或人格定论。</p>
          <div>
            <button class="secondary-button" id="learnBackButton" type="button">返回首页</button>
            <button class="primary-button" id="learnStartButton" type="button">开始测试</button>
          </div>
        </div>
      </section>
    </template>

    <template id="calibrationTemplate">
      <section class="work-page">
        <div class="stepper" aria-label="测试流程">
          <span class="done">开始</span>
          <span class="current">工作场景</span>
          <span>动态测试</span>
          <span>结果</span>
        </div>

        <div class="work-heading">
          <h1>要不要先校准你的工作场景？</h1>
          <div class="title-rule" aria-hidden="true"></div>
          <p>
            这部分不会直接改变你的个人含活人量分数，只帮助结果页区分：是你本人难蒸，还是这份工作本身更容易或更不容易被蒸。
          </p>
        </div>

        <form id="roleForm" class="work-card">
          <fieldset>
            <legend>1. 你的主要工作领域是？</legend>
            <div class="radio-grid">
              <label><input name="taskShape" type="radio" value="routine" /><span>产品/设计</span></label>
              <label><input name="taskShape" type="radio" value="ruleException" /><span>研发/技术</span></label>
              <label><input name="taskShape" type="radio" value="coordination" /><span>运营/增长</span></label>
              <label><input name="taskShape" type="radio" value="direction" /><span>市场/品牌</span></label>
              <label><input name="taskShape" type="radio" value="direction" /><span>管理/战略</span></label>
              <label><input name="taskShape" type="radio" value="ruleException" /><span>其他</span></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>2. 你的工作更接近？</legend>
            <div class="radio-grid">
              <label><input name="aiExposure" type="radio" value="standard" /><span>执行落地</span></label>
              <label><input name="aiExposure" type="radio" value="partial" /><span>判断决策</span></label>
              <label><input name="aiExposure" type="radio" value="draft" /><span>创意生成</span></label>
              <label><input name="aiExposure" type="radio" value="guarded" /><span>策略规划</span></label>
              <label><input name="aiExposure" type="radio" value="partial" /><span>支持协同</span></label>
              <label><input name="aiExposure" type="radio" value="guarded" /><span>多种兼具</span></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>3. 你的工作环境节奏是？</legend>
            <div class="radio-grid compact">
              <label><input name="sopHardPart" type="radio" value="trust" /><span>高度变化</span></label>
              <label><input name="sopHardPart" type="radio" value="exceptions" /><span>中等变化</span></label>
              <label><input name="sopHardPart" type="radio" value="efficiency" /><span>相对稳定</span></label>
              <label><input name="sopHardPart" type="radio" value="taste" /><span>周期性变化</span></label>
            </div>
          </fieldset>
        </form>

        <div class="work-actions">
          <button class="primary-button" id="calibrationContinueButton" type="button">提交，开始测试</button>
          <button class="secondary-button" id="calibrationSkipButton" type="button">跳过，直接测试</button>
        </div>
        <p class="skip-note">跳过后仍可得到个人含活人量；结果页只是不显示岗位蒸馏度判断。</p>
      </section>
    </template>

    <template id="questionTemplate">
      <section class="quiz-page">
        <aside class="quiz-sidebar">
          <a class="quiz-brand" href="./">
            <img src="./assets/ui-art/icon-brand-flask.svg" alt="" />
            <span><strong>抗蒸性测试</strong><small>测测你的含活人量</small></span>
          </a>
          <nav aria-label="测试状态">
            <span class="active">正在测试</span>
            <button id="quizLearnButton" type="button">测试说明</button>
            <button id="quizRestartButton" type="button">退出后可重新开始</button>
          </nav>
        </aside>

        <div class="quiz-main">
          <div class="mobile-quizbar">
            <button class="icon-button" id="mobileBackButton" type="button" aria-label="上一题">‹</button>
            <strong id="mobilePhaseLabel"></strong>
            <button class="icon-button" id="mobileMenuButton" type="button" aria-label="菜单">☰</button>
          </div>

          <section class="question-card">
            <div class="question-topline">
              <div>
                <p id="phaseLabel"></p>
                <span id="sectionIntro"></span>
              </div>
              <div class="progress-dots" id="progressDots" aria-label="答题进度"></div>
            </div>
            <h1 id="questionText"></h1>
            <div class="option-list" id="optionList"></div>
            <div class="question-footer">
              <button class="secondary-button prev-button" id="backButton" type="button">上一题</button>
              <p>没有绝对正确的答案，选最接近你的那一个</p>
            </div>
          </section>

          <div class="smoke-density" aria-label="烟雾浓度">
            <span>烟雾浓度</span>
            <i></i>
            <strong id="densityText">中等</strong>
          </div>
        </div>
      </section>
    </template>

    <template id="resultTemplate">
      <section class="result-page" id="resultLayout">
        <div class="result-topbar">
          <a class="result-brand" href="./">
            <img src="./assets/ui-art/icon-brand-flask.svg" alt="" />
            <span>抗蒸性测试</span>
          </a>
          <div>
            <button class="secondary-button small-button" id="restartButton" type="button">再测一次</button>
            <button class="dark-button small-button" id="copyButton" type="button">分享结果</button>
          </div>
        </div>

        <section class="result-hero">
          <div class="score-block">
            <p class="result-complete">测试完成！</p>
            <div class="score-title">你的<br />含活人量</div>
            <div class="score-line"><span id="scoreValue"></span><b>%</b></div>
            <p id="scoreHelp"></p>
          </div>
          <div class="rank-block">
            <p>你的段位是</p>
            <div class="rank-title-row">
              <h1 id="bandName"></h1>
              <img id="bandBadge" src="" alt="" />
            </div>
            <p id="bandLine"></p>
            <p class="band-roast" id="bandRoast"></p>
          </div>
        </section>

        <div class="result-card-grid">
          <button class="result-card tag-summary" id="labelDetailButton" type="button">
            <span>你的结构标签</span>
            <img id="labelBadge" src="" alt="" />
            <strong id="labelName"></strong>
            <p id="labelMeaning"></p>
            <i>查看标签详情</i>
          </button>

          <section class="result-card share-panel">
            <h2>一句话分享</h2>
            <p id="shareLine"></p>
            <span id="shareHash"></span>
          </section>

          <section class="result-card role-panel" id="rolePanel">
            <h2>岗位蒸馏度</h2>
            <strong id="roleTitle"></strong>
            <p id="roleResult"></p>
          </section>
        </div>

        <div class="result-lower-grid">
          <section class="result-panel dimensions-panel">
            <h2>六大维度表现 <small>点击维度查看详情</small></h2>
            <div class="dimension-list" id="dimensionList"></div>
          </section>
          <section class="result-panel evidence-panel">
            <h2>为什么这么判？</h2>
            <p id="reasoningText"></p>
            <div class="signal-list" id="signalList"></div>
            <button class="link-button" id="methodButton" type="button">查看完整逻辑</button>
          </section>
        </div>
      </section>
    </template>

    <template id="detailTemplate">
      <div class="detail-backdrop" id="detailBackdrop">
        <aside class="detail-drawer" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
          <button class="close-button" id="detailCloseButton" type="button" aria-label="关闭">×</button>
          <div class="detail-tabs">
            <span class="active" id="detailType"></span>
            <span>维度详情</span>
          </div>
          <div class="detail-hero">
            <img id="detailAsset" src="" alt="" />
            <div>
              <h2 id="detailTitle"></h2>
              <p id="detailSubtitle"></p>
            </div>
          </div>
          <div class="detail-sections" id="detailSections"></div>
          <button class="secondary-button" id="detailNextButton" type="button">查看下一个维度</button>
        </aside>
      </div>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
