<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="抗蒸性测试：测测你的含活人量、不可蒸馏度和同事 Skill 适配度。" />
    <title>抗蒸性测试</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="intro" id="intro">
        <div class="intro-copy">
          <p class="eyebrow">Anti-Distilled Test</p>
          <h1>抗蒸性测试</h1>
          <p class="lede">
            假如你的文档、聊天记录和工作习惯被蒸馏成一个“同事 Skill”，还剩多少东西必须由你本人来判断？
          </p>
          <div class="intro-actions">
            <button class="primary" id="startBtn">开始测含活人量</button>
          </div>
          <p class="intro-note">本测试不反 AI，也不奖励故作神秘；高分来自可表达、可验证、能承担的复杂判断。</p>
        </div>

        <div class="preview-panel" aria-label="测评概要">
          <div class="preview-top">
            <span>测评流程</span>
            <strong>24 题 / 6 章</strong>
          </div>
          <div class="preview-ring">
            <span>24</span>
            <small>情境判断题</small>
          </div>
          <dl class="preview-list">
            <div>
              <dt>主指标</dt>
              <dd>含活人量</dd>
            </div>
            <div>
              <dt>能力指标</dt>
              <dd>不可蒸馏度</dd>
            </div>
            <div>
              <dt>协作指标</dt>
              <dd>同事 Skill 适配度</dd>
            </div>
          </dl>
        </div>
      </section>

      <section class="tester hidden" id="tester">
        <aside class="side-panel" aria-label="答题进度">
          <div class="progress-block">
            <div class="progress-label">
              <span id="progressText">第 1 / 24 题</span>
              <strong id="chapterText">可 Skill 化</strong>
            </div>
            <div class="progress-track">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>
          <div class="chapter-list" id="chapterList"></div>
        </aside>

        <section class="question-panel" aria-live="polite">
          <div class="chapter-banner">
            <p class="chapter-kicker" id="questionChapter"></p>
            <p class="question-subtitle" id="questionSubtitle"></p>
          </div>
          <h2 id="questionTitle"></h2>
          <div class="options" id="options"></div>
          <div class="nav-row">
            <button class="secondary" id="prevBtn">上一题</button>
          </div>
        </section>
      </section>

      <section class="results hidden" id="results">
        <div class="result-hero">
          <div class="result-copy">
            <p class="eyebrow">你的测评结果</p>
            <h2 id="resultTitle">半蒸半活型</h2>
            <p class="result-type" id="resultType"></p>
            <p id="resultCopy"></p>
            <p class="heart-line" id="heartLine"></p>
          </div>
          <div class="hero-score">
            <span id="humanScore">0%</span>
            <small>含活人量</small>
          </div>
        </div>

        <div class="metric-grid">
          <article>
            <span>不可蒸馏度</span>
            <strong id="undistillableScore">0%</strong>
          </article>
          <article>
            <span>同事 Skill 适配度</span>
            <strong id="skillFitScore">0%</strong>
          </article>
          <article>
            <span>分享短句</span>
            <strong class="share-line" id="shareLine">一半可调用，一半还活着。</strong>
          </article>
        </div>

        <div class="analysis-layout">
          <section class="breakdown">
            <h3>六维拆解</h3>
            <div id="dimensionBars"></div>
          </section>
          <section class="breakdown">
            <h3>你的抗蒸说明</h3>
            <div class="personal-notes" id="personalNotes"></div>
          </section>
        </div>

        <div class="result-actions">
          <button class="primary" id="retakeBtn">重新测一次</button>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
